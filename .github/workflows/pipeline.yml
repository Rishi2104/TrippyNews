name: NewsCheck Automated Pipeline

on:
  schedule:
    # Run every 1 hour
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

# Prevent concurrent pipeline executions (SQLite single-writer safety)
concurrency:
  group: newscheck-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run NewsCheck Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          newscheck run --json-logs

      - name: Commit Updated Database and Public Site
        run: |
          git config --global user.name "newscheck-bot"
          git config --global user.email "bot@newscheck.local"
          git add newscheck.db public/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: persist automated run database and public site [skip ci]"
            # Pull with rebase in case of any concurrent remote commits, then push
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: run-pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
